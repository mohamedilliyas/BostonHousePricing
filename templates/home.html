<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boston House Price Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1d3557, #457b9d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #1d3557;
            color: #fff;
            padding: 25px;
            text-align: center;
        }

        .content {
            padding: 30px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            grid-column: 1 / -1;
            padding: 14px;
            background: #1d3557;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16324f;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            color: #2a9d8f;
            background: #e9f7f5;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Boston House Price Prediction</h1>
        <p>Machine Learning Based Price Estimation</p>
    </div>

    <div class="content">
        <form action="{{ url_for('predict') }}" method="post" id="predictForm">
            <input type="number" step="any" name="CRIM" placeholder="CRIM" required>
            <input type="number" step="any" name="ZN" placeholder="ZN" required>
            <input type="number" step="any" name="INDUS" placeholder="INDUS" required>
            <input type="number" step="any" name="CHAS" placeholder="CHAS (0 or 1)" required>
            <input type="number" step="any" name="NOX" placeholder="NOX" required>
            <input type="number" step="any" name="RM" placeholder="RM" required>
            <input type="number" step="any" name="AGE" placeholder="AGE" required>
            <input type="number" step="any" name="DIS" placeholder="DIS" required>
            <input type="number" step="any" name="RAD" placeholder="RAD" required>
            <input type="number" step="any" name="TAX" placeholder="TAX" required>
            <input type="number" step="any" name="PTRATIO" placeholder="PTRATIO" required>
            <input type="number" step="any" name="B" placeholder="B" required>
            <input type="number" step="any" name="LSTAT" placeholder="LSTAT" required>

            <button type="submit">Predict House Price</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>
</div>

<script>
    // Save input values before submit
    document.getElementById("predictForm").addEventListener("submit", function () {
        const inputs = document.querySelectorAll("input");
        inputs.forEach(input => {
            localStorage.setItem(input.name, input.value);
        });
    });

    // Restore input values after page reload
    window.onload = function () {
        const inputs = document.querySelectorAll("input");
        inputs.forEach(input => {
            if (localStorage.getItem(input.name)) {
                input.value = localStorage.getItem(input.name);
            }
        });
    };
</script>

</body>
</html>
